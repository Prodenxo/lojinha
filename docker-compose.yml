# MySQL local para desenvolvimento (em produção o banco roda no Easypanel)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lojinha
      MYSQL_USER: lojinha
      MYSQL_PASSWORD: lojinha
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
